<style>
:root{
  /* אותם צבעים בדיוק כמו ב-/celiac ובשאר המדריכים */
  --bg:#efe7d4; --paper:#f8f5ee; --ink:#2a2a24; --muted:#6b6a5e;
  --olive:#5c6b3c; --olive-deep:#3d4728; --gold:#b8933f; --line:#e2d9c2;
  --sel-bg:#eef1e4; --on-olive:#f8f5ee;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* בלי מצב כהה: כל האתר שלה קרם, תמיד. דף שמתהפך לכהה אצל חלק
   מהנשים שמקבלות את הקישור מהקרוסלה נראה כמו אתר אחר. */
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Assistant","Heebo","Arial Hebrew",Arial,sans-serif;font-size:18px;line-height:1.55;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 20px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.wheel{width:44px;height:44px;flex:none;color:var(--olive);transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}
.count{font-size:14px;color:var(--muted);min-width:44px;text-align:left}
h1,h2{font-family:"Frank Ruhl Libre",Georgia,serif;color:var(--olive-deep);margin:0 0 12px}
h1{font-size:40px;line-height:1.1;font-weight:900}
h2{font-size:27px;line-height:1.25;font-weight:700}
.sub{color:var(--muted);margin:0 0 28px}
.hint{font-size:15px;color:var(--muted);margin:-4px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  font:inherit;text-align:right;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;min-height:56px;
}
.opt .mark{width:22px;height:22px;flex:none;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--olive);background:var(--sel-bg)}
.opt[aria-pressed="true"] .mark{background:var(--olive);border-color:var(--olive)}
.opt[aria-pressed="true"] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-olive)}
.opt.multi[aria-pressed="true"] .mark::after{width:10px;height:6px;border-radius:0;background:none;border:2px solid var(--on-olive);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
input[type=text],textarea{
  font:inherit;width:100%;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;
}
textarea{min-height:180px;font-size:15px;line-height:1.5;resize:vertical}
.nav{display:flex;gap:10px;margin-top:26px;align-items:center}
.btn{
  font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;
  background:var(--olive);color:var(--on-olive);text-decoration:none;display:inline-flex;justify-content:center;align-items:center;min-height:52px
}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--muted);padding:14px 8px;font-weight:600}
.btn.wide{width:100%}
.btn.gold{background:var(--gold);color:#2b2a22}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.note{font-size:15px;color:var(--olive-deep);min-height:24px;margin-top:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cover{text-align:center}
.cover-logo{display:block;width:104px;height:auto;margin:4px auto 20px}
.cover-tag{display:inline-block;font-size:11.5px;letter-spacing:.24em;font-weight:700;
  color:var(--gold);background:#f7efdc;border-radius:99px;padding:6px 18px;margin:0 0 14px}
.cover .sub{margin-inline:auto;max-width:34ch}
.sign{margin-top:36px;font-size:14px;color:var(--muted)}
.sign a{color:var(--muted)}
.screen{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.wheel,.bar i{transition:none}}
[hidden]{display:none!important}

function progress(){
  // הכריכה היא כריכה: סרגל ריק מעליה נראה כמו טעינה תקועה
  document.querySelector("header").hidden = step === -1;
  const done = Math.max(0, Math.min(step, TOTAL));
  document.getElementById("bar").style.width = (done/TOTAL*100)+"%";
  document.getElementById("wheel").style.transform = `rotate(${-done/TOTAL*300}deg)`;
  document.getElementById("count").textContent = (step>=0 && step<TOTAL) ? `${step+1}/${TOTAL}` : "";
}

function render(){
  progress();
  app.innerHTML = "";
  const s = el("section",{class:"screen"});
  if(step === -1) intro(s);
  else if(step < TOTAL) question(s, step);
  else if(step === TOTAL) nameScreen(s);
  else finish(s);
  app.append(s);
  const h = s.querySelector("h1,h2"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}
  window.scrollTo(0,0);
}

function intro(s){
  s.className = "screen cover";
  s.append(
    el("img",{class:"cover-logo",src:LOGO,alt:"בין הראש לצלחת",width:"515",height:"520"}),
    el("p",{class:"cover-tag"},"תרגיל קצר"),
    el("h1",{},"מה באמת מנהל אותך?"),
    el("p",{class:"sub"},"9 שאלות קצרות על הבוקר, על המשקל ועל מה שקורה אחר כך. סמני את מה שהכי קרוב אלייך. אין תשובות נכונות. אני קוראת כל תשובה בעצמי, וחוזרת אלייך עם תשובה אישית."),
    el("button",{class:"btn wide",onclick:()=>{step=0;render();}},"מתחילות")
  );
}

function question(s, i){
  const q = Q[i];
  s.append(el("h2",{},q.q));
  if(q.hint) s.append(el("p",{class:"hint"},q.hint));
  const box = el("div",{class:"opts",role:q.multi?"group":"radiogroup"});
  const list = q.other ? [...q.o, q.otherLabel || "משהו אחר"] : q.o;
  const otherIdx = q.other ? list.length-1 : -1;
  const input = el("input",{type:"text",placeholder:"כתבי במילים שלך",value:otherText[i]});
  input.addEventListener("input",()=>{otherText[i]=input.value;nextBtn.disabled=!ready(i);});
  list.forEach((label, k) => {
    const pressed = q.multi ? ans[i].includes(k) : ans[i]===k;
    const b = el("button",{class:"opt"+(q.multi?" multi":""),"aria-pressed":String(pressed),type:"button"},
      el("span",{class:"mark","aria-hidden":"true"}), el("span",{},label));
    b.addEventListener("click",()=>{
      if(q.multi){
        const noneIdx = q.o.indexOf(q.none);
        let a = ans[i];
        if(a.includes(k)) a = a.filter(x=>x!==k);
        else a = (k===noneIdx) ? [k] : [...a.filter(x=>x!==noneIdx), k];
        ans[i] = a;
        [...box.children].forEach((c,j)=>c.setAttribute("aria-pressed",String(a.includes(j))));
        nextBtn.disabled = !ready(i);
      } else {
        ans[i] = k;
        [...box.children].forEach((c,j)=>c.setAttribute("aria-pressed",String(j===k)));
        input.hidden = k!==otherIdx;
        nextBtn.disabled = !ready(i);
        if(k===otherIdx) input.focus();
        else setTimeout(()=>{ if(step===i){step++;render();} }, 320);
      }
    });
    box.append(b);
  });
  s.append(box);
  if(q.other){ input.hidden = ans[i]!==otherIdx; s.append(input); }
  const nextBtn = el("button",{class:"btn",type:"button",onclick:()=>{step++;render();}},"הבא");
  nextBtn.disabled = !ready(i);
  s.append(el("div",{class:"nav"}, nextBtn, el("button",{class:"btn ghost",type:"button",onclick:()=>{step--;render();}},"חזרה")));
}

function ready(i){
  const q = Q[i];
  if(q.multi) return ans[i].length>0;
  if(ans[i]===null) return false;
  if(q.other && ans[i]===q.o.length) return otherText[i].trim().length>0;
  return true;
}

function nameScreen(s){
  s.append(el("h2",{},"ואיך קוראים לך?"),
    el("p",{class:"hint"},"כדי שאדע למי לחזור עם התשובה"));
  const input = el("input",{type:"text",placeholder:"השם שלך",value:name,autocomplete:"given-name"});
  const go = el("button",{class:"btn",type:"button",onclick:()=>{step++;render();}},"לסיום");
  go.disabled = !name.trim();
  input.addEventListener("input",()=>{name=input.value;go.disabled=!name.trim();});
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&name.trim()){step++;render();}});
  const more = el("textarea",{placeholder:"רוצה לספר לי עוד משהו? (לא חובה)","aria-label":"עוד משהו שתרצי שאדע"});
  more.style.minHeight="110px"; more.value = extra;
  more.addEventListener("input",()=>{extra=more.value;});
  s.append(input, more, el("div",{class:"nav"}, go, el("button",{class:"btn ghost",type:"button",onclick:()=>{step--;render();}},"חזרה")));
}

function answerText(i){
  const q = Q[i];
  if(q.multi) return ans[i].map(k=>q.o[k]).join(", ");
  if(q.other && ans[i]===q.o.length) return otherText[i].trim();
  return q.o[ans[i]];
}

function message(){
  const lines = [`היי אתי, מילאתי את התרגיל ״מה באמת מנהל אותך״ 🌿`, `שם: ${name.trim()}`, ""];
  Q.forEach((q,i)=>lines.push(`${i+1}. ${q.short}: ${answerText(i)}`));
  if(extra.trim()) lines.push("", `עוד משהו: ${extra.trim()}`);
  return lines.join("\n");
}

async function copy(text, ta){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{ ta.focus(); ta.select(); return document.execCommand("copy"); } catch(_){ return false; }
  }
}

function finish(s){
  const text = message();
  s.append(el("h2",{},`תודה, ${name.trim()}`),
    el("p",{class:"sub"},"נשאר רק לשלוח לי את התשובות. אקרא אותן בעצמי ואחזור אלייך עם תשובה אישית."));
  const ta = el("textarea",{readonly:"","aria-label":"התשובות שלך"}); ta.value = text;
  const note = el("p",{class:"note",role:"status"});
  const stack = el("div",{class:"stack"});
  if(WA_NUMBER){
    stack.append(el("a",{class:"btn wide",href:`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`,target:"_blank",rel:"noopener"},"שליחה בוואטסאפ"));
  }
  const igBtn = el("button",{class:"btn wide "+(WA_NUMBER?"gold":""),type:"button"},"העתקה ושליחה באינסטגרם");
  igBtn.addEventListener("click", async ()=>{
    const ok = await copy(text, ta);
    note.textContent = ok ? "התשובות הועתקו. עכשיו הדביקי אותן בהודעה אליי." : "סמני את הטקסט למטה, העתיקי, והדביקי בהודעה אליי.";
    window.open(`https://ig.me/m/${IG_USER}`,"_blank","noopener");
  });
  stack.append(igBtn);
  s.append(stack, note, ta,
    el("div",{class:"nav"}, el("button",{class:"btn ghost",type:"button",onclick:()=>{step=0;render();}},"לשנות תשובות")));
}

render();
</script>
